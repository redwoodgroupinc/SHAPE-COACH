name: Android app

# Builds the ShapeCoach Android App Bundle (a Trusted Web Activity around the website).
# The bundle is built unsigned: the upload key never lives in this public repository.
# Sign it locally before uploading to Play Console (see docs/PLAY_STORE.md).
# A second job runs the debug build on an Android emulator against the live site and publishes
# screenshots and a short report to the same branch (smoke/).

on:
  push:
    branches: [main, 'claude/**']
    paths: ['android/**', '.github/workflows/android.yml', 'scripts/android-smoke.sh']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runners come with the Android SDK; add the API 36 platform to it.
      - name: Install Android 16 (API 36) platform and build tools
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build the unsigned release bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: shapecoach-release-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish the bundle to the android-build branch
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out
          cp android/app/build/outputs/bundle/release/app-release.aab out/shapecoach-unsigned.aab
          cd out
          printf 'Unsigned ShapeCoach release bundle\nSource commit: %s\nBranch: %s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > BUILD.txt
          git init -q -b android-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Unsigned release bundle built from $GITHUB_SHA"
          git push -fq "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" android-build

  emulator:
    name: Smoke test on an Android emulator
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 16 (API 36) platform and build tools
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build the debug app
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on an Android 14 emulator with Chrome
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/android-smoke.sh android/app/build/outputs/apk/debug/app-debug.apk smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: smoke
          if-no-files-found: warn

      - name: Publish the results to the android-build branch
        if: always() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/'))
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p smoke
          printf 'Source commit: %s\n' "$GITHUB_SHA" >> smoke/result.txt
          git clone -q --depth 1 --branch android-build "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" results
          rm -rf results/smoke
          cp -r smoke results/smoke
          cd results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Emulator smoke test for $GITHUB_SHA"
          git push -q origin android-build
